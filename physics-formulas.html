<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #12141c;
    --bg-raised: #191c26;
    --line: #2a2f3d;
    --parchment: #3355c2;
    --parchment-dim: #4a5488;
    --amber: #22399e;
    --teal: #a8356f;
    --teal-dim: #a8356f33;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--parchment);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  body{
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, #24283a 0%, transparent 60%),
      repeating-linear-gradient(180deg, transparent 0px, transparent 27px, #ffffff05 28px);
  }

  .wrap{ max-width: 720px; margin: 0 auto; padding: 22px 16px 80px; }

  /* Header */
  header{ margin-bottom: 20px; }
  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--teal); margin-bottom: 8px;
  }
  h1{
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: 34px;
    line-height: 1.1;
    margin: 0 0 6px;
    color: var(--parchment);
    letter-spacing: -0.01em;
  }
  .subtitle{
    font-size: 14px;
    color: var(--parchment-dim);
    font-family: 'Newsreader', serif;
    font-style: italic;
  }

  /* Search */
  .search-bar{
    position: sticky; top: 12px; z-index: 20;
    margin: 18px 0 20px;
  }
  .search-inner{
    display:flex; align-items:center; gap:10px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 14px;
    box-shadow: 0 8px 24px -12px #000000aa;
  }
  .search-inner svg{ flex-shrink:0; opacity:0.55; }
  #search{
    flex:1; background:none; border:none; outline:none;
    color: var(--parchment);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14.5px;
  }
  #search::placeholder{ color: var(--parchment-dim); }
  .search-count{
    font-family:'IBM Plex Mono',monospace;
    font-size: 11px; color: var(--parchment-dim);
    margin-top: 8px; padding-left: 2px;
    min-height: 14px;
  }

  /* Category */
  .category{
    margin-bottom: 10px;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    background: linear-gradient(180deg, #161923, #131620);
  }
  .cat-head{
    display:flex; align-items:center; gap:12px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
  }
  .cat-num{
    font-family:'IBM Plex Mono',monospace;
    font-size: 11px; color: var(--amber);
    border: 1px solid #22399e55;
    border-radius: 5px;
    padding: 2px 6px;
    flex-shrink:0;
  }
  .cat-title{
    font-family:'Newsreader',serif;
    font-weight: 500;
    font-size: 17px;
    flex: 1;
    color: var(--parchment);
  }
  .cat-count{
    font-family:'IBM Plex Mono',monospace;
    font-size: 11px;
    color: var(--parchment-dim);
  }
  .chevron{
    width: 9px; height: 9px;
    border-right: 1.5px solid var(--parchment-dim);
    border-bottom: 1.5px solid var(--parchment-dim);
    transform: rotate(45deg);
    transition: transform 0.25s ease;
    margin-right: 2px;
  }
  .category.open .chevron{ transform: rotate(-135deg); }

  .cat-body{
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }
  .category.open .cat-body{ max-height: 3000px; }

  .formulas{ padding: 2px 12px 12px; }

  /* Formula card */
  .f-card{
    padding: 11px 10px;
    border-top: 1px solid var(--line);
  }
  .f-card:first-child{ border-top: none; }
  .f-name{
    font-size: 12.5px;
    color: var(--teal);
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: 0.01em;
  }
  .f-eq{
    font-family:'IBM Plex Mono',monospace;
    font-size: 14.5px;
    color: #f5f5f8;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .f-note{
    font-size: 11.5px;
    color: #c9c9d2;
    margin-top: 5px;
    font-style: italic;
  }
  mark{
    background: var(--teal-dim);
    color: var(--teal);
    border-radius: 3px;
    padding: 0 2px;
  }

  .empty-state{
    text-align:center;
    padding: 50px 20px;
    color: var(--parchment-dim);
    font-family: 'Newsreader', serif;
    font-style: italic;
    font-size: 15px;
    display:none;
  }

  footer{
    text-align:center;
    margin-top: 30px;
    font-family:'IBM Plex Mono',monospace;
    font-size: 10.5px;
    color: #4a4e5c;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Formula Bench · Mechanics → Waves</div>
    <h1>Physics Reference</h1>
    <div class="subtitle">Nine chapters, one page. Tap a section to open it.</div>
  </header>

  <div class="search-bar">
    <div class="search-inner">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5.5" stroke="#a7a693" stroke-width="1.4"/><path d="M11 11L14.5 14.5" stroke="#a7a693" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input id="search" type="text" placeholder="Search a quantity, e.g. 'escape velocity' or 'g'" autocomplete="off">
    </div>
    <div class="search-count" id="searchCount"></div>
  </div>

  <div id="categories"></div>
  <div class="empty-state" id="emptyState">No formulas match that search. Try a shorter term.</div>

  <footer>COMPILED FROM PROJECT NOTES · TAP SECTIONS TO EXPAND</footer>
</div>

<script>
const DATA = [
  { title: "Kinematics & Motion", items: [
    { name: "Equations of motion (constant a)", eq: "v = u + a·t\ns = u·t + ½·a·t²\nv² = u² + 2·a·s\nsₙ = u + (a/2)·(2n − 1)", note: "sₙ = distance covered in the nth second" },
    { name: "Projectile motion", eq: "T = (2·u·sinθ) / g\nH = (u²·sin²θ) / (2·g)\nR = (u²·sin2θ) / g", note: "T = time of flight, H = max height, R = range" },
    { name: "Uniform circular motion", eq: "a_c = v²/r = ω²·r", note: "centripetal acceleration" }
  ]},
  { title: "Laws of Motion & Friction", items: [
    { name: "Newton's second law", eq: "F = m·a = dp/dt" },
    { name: "Impulse", eq: "J = F·Δt = Δp" },
    { name: "Static friction", eq: "f_s ≤ μ_s·N" },
    { name: "Kinetic friction", eq: "f_k = μ_k·N" },
    { name: "Banking of roads — max safe speed", eq: "Without friction: v = √(r·g·tanθ)\nWith friction: v_max = √( r·g·(μ_s + tanθ)/(1 − μ_s·tanθ) )" }
  ]},
  { title: "Work, Energy & Power", items: [
    { name: "Work done", eq: "W = F·d·cosθ" },
    { name: "Kinetic energy", eq: "K = ½·m·v² = p²/(2·m)" },
    { name: "Work–energy theorem", eq: "W_net = ΔK" },
    { name: "Spring potential energy", eq: "U = ½·k·x²" },
    { name: "Power", eq: "P = dW/dt = F·v" },
    { name: "Coefficient of restitution", eq: "e = (v₂ − v₁) / (u₁ − u₂)", note: "e = 1 for a perfectly elastic collision" }
  ]},
  { title: "System of Particles & Rotational Motion", items: [
    { name: "Center of mass", eq: "R_cm = Σ(mᵢ·rᵢ) / Σ(mᵢ)" },
    { name: "Torque", eq: "τ = r·F·sinθ = I·α" },
    { name: "Angular momentum", eq: "L = r·p·sinθ = I·ω" },
    { name: "Rotational kinetic energy", eq: "K_rot = ½·I·ω²" },
    { name: "Moment of inertia theorems", eq: "Parallel axis: I = I_cm + M·d²\nPerpendicular axis: I_z = I_x + I_y" }
  ]},
  { title: "Gravitation", items: [
    { name: "Newton's law of gravitation", eq: "F = G·(m₁·m₂) / r²" },
    { name: "Acceleration due to gravity", eq: "Surface: g = G·M / R²\nAt height h (h ≪ R): g′ = g·(1 − 2h/R)\nAt depth d: g′ = g·(1 − d/R)" },
    { name: "Gravitational potential energy", eq: "U = −(G·M·m) / r" },
    { name: "Escape velocity", eq: "v_e = √(2·G·M / R) = √(2·g·R)" },
    { name: "Orbital velocity", eq: "v_o = √(G·M / R) = √(g·R)" },
    { name: "Kepler's third law", eq: "T² ∝ a³" }
  ]},
  { title: "Mechanical Properties of Solids & Fluids", items: [
    { name: "Young's modulus", eq: "Y = (F·L) / (A·ΔL)" },
    { name: "Pressure at depth", eq: "P = P₀ + ρ·g·h" },
    { name: "Equation of continuity", eq: "A₁·v₁ = A₂·v₂" },
    { name: "Bernoulli's equation", eq: "P + ½·ρ·v² + ρ·g·h = constant" },
    { name: "Stokes' law (viscous force)", eq: "F = 6·π·η·r·v" },
    { name: "Terminal velocity", eq: "v_t = (2/9)·( r²·(ρ − σ)·g ) / η" },
    { name: "Surface tension", eq: "T = F / L" },
    { name: "Excess pressure — liquid drop", eq: "ΔP = 2·T / R" },
    { name: "Excess pressure — soap bubble", eq: "ΔP = 4·T / R" }
  ]},
  { title: "Thermodynamics & Heat", items: [
    { name: "Specific heat capacity", eq: "Q = m·c·ΔT" },
    { name: "Latent heat", eq: "Q = m·L" },
    { name: "Thermal linear expansion", eq: "ΔL = L·α·ΔT" },
    { name: "First law of thermodynamics", eq: "ΔQ = ΔU + W" },
    { name: "Work done in processes", eq: "Isothermal: W = n·R·T·ln(V₂/V₁)\nAdiabatic: W = (P₁V₁ − P₂V₂) / (γ − 1)\nIsobaric: W = P·(V₂ − V₁)\nIsochoric: W = 0" }
  ]},
  { title: "Kinetic Theory of Gases", items: [
    { name: "Ideal gas law", eq: "P·V = n·R·T = N·k_B·T" },
    { name: "RMS speed", eq: "v_rms = √(3·R·T / M) = √(3·k_B·T / m)" },
    { name: "Average KE per molecule", eq: "E = (f/2)·k_B·T", note: "f = degrees of freedom" }
  ]},
  { title: "Oscillations & Waves", items: [
    { name: "SHM displacement", eq: "x(t) = A·sin(ω·t + φ)" },
    { name: "SHM velocity", eq: "v = ω·√(A² − x²)" },
    { name: "SHM acceleration", eq: "a = −ω²·x" },
    { name: "Simple pendulum period", eq: "T = 2π·√(L / g)" },
    { name: "Spring–mass period", eq: "T = 2π·√(m / k)" },
    { name: "Wave velocity", eq: "v = f·λ" },
    { name: "Speed of sound (Laplace)", eq: "v = √(γ·P / ρ)" },
    { name: "Doppler effect", eq: "f′ = f·( (v ± v_observer) / (v ∓ v_source) )" }
  ]}
];

const container = document.getElementById('categories');
const searchInput = document.getElementById('search');
const searchCount = document.getElementById('searchCount');
const emptyState = document.getElementById('emptyState');

function escapeRx(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function highlight(text, term){
  if(!term) return escapeHtml(text);
  const rx = new RegExp('(' + escapeRx(term) + ')', 'ig');
  return escapeHtml(text).replace(rx, '<mark>$1</mark>');
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render(term){
  container.innerHTML = '';
  let totalMatches = 0;
  const isSearching = term.trim().length > 0;
  const t = term.trim().toLowerCase();

  DATA.forEach((cat, ci) => {
    const matchedItems = cat.items.filter(it => {
      if(!isSearching) return true;
      return (it.name + ' ' + it.eq + ' ' + (it.note||'')).toLowerCase().includes(t);
    });
    if(isSearching && matchedItems.length === 0) return;

    totalMatches += matchedItems.length;

    const catEl = document.createElement('div');
    catEl.className = 'category' + (isSearching ? ' open' : (ci === 0 ? ' open' : ''));

    const head = document.createElement('div');
    head.className = 'cat-head';
    head.innerHTML = `
      <span class="cat-num">${String(ci+1).padStart(2,'0')}</span>
      <span class="cat-title">${cat.title}</span>
      <span class="cat-count">${matchedItems.length}</span>
      <span class="chevron"></span>
    `;
    head.addEventListener('click', () => {
      catEl.classList.toggle('open');
    });

    const body = document.createElement('div');
    body.className = 'cat-body';
    const formulas = document.createElement('div');
    formulas.className = 'formulas';

    (isSearching ? matchedItems : cat.items).forEach(it => {
      const card = document.createElement('div');
      card.className = 'f-card';
      card.innerHTML = `
        <div class="f-name">${highlight(it.name, isSearching ? t : '')}</div>
        <div class="f-eq">${highlight(it.eq, isSearching ? t : '')}</div>
        ${it.note ? `<div class="f-note">${highlight(it.note, isSearching ? t : '')}</div>` : ''}
      `;
      formulas.appendChild(card);
    });

    body.appendChild(formulas);
    catEl.appendChild(head);
    catEl.appendChild(body);
    container.appendChild(catEl);
  });

  if(isSearching){
    searchCount.textContent = totalMatches + (totalMatches === 1 ? ' match' : ' matches');
    emptyState.style.display = totalMatches === 0 ? 'block' : 'none';
  } else {
    searchCount.textContent = '';
    emptyState.style.display = 'none';
  }
}

searchInput.addEventListener('input', (e) => render(e.target.value));
render('');
</script>
</body>
</html>
